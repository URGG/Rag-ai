<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0A0A0B;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            border: 1px solid #27272A;
            border-radius: 12px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 12px;
            color: #3B82F6;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }
        
        .loader-container {
            width: 250px;
            height: 4px;
            background-color: #18181B;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6);
            animation: load 5s ease-in-out forwards;
        }
        
        @keyframes load {
            0% {
                width: 0%;
            }
            50% {
                width: 60%;
            }
            100% {
                width: 100%;
            }
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
                filter: drop-shadow(0 0 10px #3B82F6);
            }
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <img src="./public/logo.png" class="logo" alt="Logo">
    <div class="title">KERNEL</div>
    <div class="subtitle">Workspace</div>
    <div class="loader-container">
        <div class="loader-bar"></div>
    </div>
</body>

</html>
